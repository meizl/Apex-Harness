<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Harness</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f2328;
    --muted: #8a919b;
    --border: #e6e8eb;
    --accent: #3b82f6;
    --user-bg: #eef4ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.7;
  }

  body {
    display: flex;
    flex-direction: column;
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 17px;
    font-weight: 600;
  }

  header .status {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px;
  }

  .msg {
    margin-bottom: 22px;
  }

  .msg.user {
    display: flex;
    justify-content: flex-end;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    padding: 9px 14px;
    border-radius: 12px;
    max-width: 75%;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.assistant .bubble {
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 92%;
  }

  .msg.assistant .bubble.pending {
    color: var(--muted);
  }

  footer {
    flex-shrink: 0;
    padding: 16px 24px 24px;
    border-top: 1px solid var(--border);
  }

  .input-wrap {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    resize: none;
    background: #f6f7f8;
    color: var(--text);
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 11px 16px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    max-height: 160px;
    outline: none;
    transition: border-color .15s, background .15s;
  }

  textarea:focus {
    background: #fff;
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 11px 22px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
  }

  button:hover { background: #2f6fe0; }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>Apex Harness</h1>
    <span class="status" id="status">就绪</span>
  </header>

  <div id="messages"></div>

  <footer>
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="输入消息，回车发送，Shift+回车换行"></textarea>
      <button id="send">发送</button>
    </div>
  </footer>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');

  function addMessage(role, text, pending) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;

    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (pending ? ' pending' : '');
    bubble.textContent = text;

    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    inputEl.value = '';
    autoResize();

    addMessage('user', text);
    const pendingBubble = addMessage('assistant', '思考中…', true);

    sendBtn.disabled = true;
    statusEl.textContent = '生成中';

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      if (!res.ok) {
        let detail = 'HTTP ' + res.status;
        try {
          const errData = await res.json();
          if (errData.detail) detail = errData.detail;
        } catch (e) { /* 非 JSON 响应，保留默认提示 */ }
        throw new Error(detail);
      }

      // 流式读取响应体，逐块显示
      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        fullText += decoder.decode(value, { stream: true });
        pendingBubble.classList.remove('pending');
        pendingBubble.textContent = fullText;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      // 冲刷解码器残留的缓冲字节
      fullText += decoder.decode();
      pendingBubble.classList.remove('pending');
      pendingBubble.textContent = fullText || '(空回复)';
    } catch (err) {
      pendingBubble.classList.remove('pending');
      if (!pendingBubble.textContent) {
        pendingBubble.textContent = '请求失败：' + err.message;
      }
    } finally {
      sendBtn.disabled = false;
      statusEl.textContent = '就绪';
      inputEl.focus();
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  sendBtn.addEventListener('click', send);

  inputEl.addEventListener('input', autoResize);

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
</script>
</body>
</html>
