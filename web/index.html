<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Harness</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f2328;
    --muted: #8a919b;
    --border: #e6e8eb;
    --accent: #3b82f6;
    --user-bg: #eef4ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.7;
  }

  body {
    display: flex;
    flex-direction: column;
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  header h1 { font-size: 16px; font-weight: 600; }
  header .status { margin-left: auto; font-size: 12px; color: var(--muted); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  .msg { margin-bottom: 18px; }

  .msg.user { display: flex; justify-content: flex-end; }

  .msg.user .bubble {
    background: var(--user-bg);
    padding: 8px 14px;
    border-radius: 12px;
    max-width: 75%;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.assistant .bubble {
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 92%;
  }

  .msg.assistant .bubble.pending { color: var(--muted); }

  footer {
    flex-shrink: 0;
    padding: 12px 24px 20px;
    border-top: 1px solid var(--border);
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 10px;
    font-size: 18px;
    line-height: 1;
    border-radius: 8px;
  }
  .icon-btn:hover { background: #f0f1f3; color: var(--text); }

  textarea {
    flex: 1;
    resize: none;
    background: #f6f7f8;
    color: var(--text);
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    max-height: 140px;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  textarea:focus { background: #fff; border-color: var(--accent); }

  button.send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
  }
  button.send:hover { background: #2f6fe0; }
  button.send:disabled { opacity: .5; cursor: not-allowed; }

  /* 参数面板：默认收起 */
  .params {
    max-height: 0;
    overflow: hidden;
    transition: max-height .25s ease;
  }
  .params.open { max-height: 320px; }

  .params-inner {
    padding: 14px 4px 4px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
  }

  .field { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .field label { color: var(--muted); min-width: 70px; flex-shrink: 0; }
  .field input[type="range"] { flex: 1; accent-color: var(--accent); }
  .field input[type="number"] {
    width: 70px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    text-align: right;
  }
  .field .val { min-width: 32px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <header>
    <h1>Apex Harness</h1>
    <span class="status" id="status">就绪</span>
  </header>

  <div id="messages"></div>

  <footer>
    <div class="params" id="params">
      <div class="params-inner">
        <div class="field">
          <label>温度</label>
          <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
          <span class="val" id="temperatureVal">0.7</span>
        </div>
        <div class="field">
          <label>Top P</label>
          <input type="range" id="top_p" min="0" max="1" step="0.05" value="1">
          <span class="val" id="top_pVal">1.0</span>
        </div>
        <div class="field">
          <label>最大长度</label>
          <input type="number" id="max_tokens" min="1" placeholder="不限">
        </div>
        <div class="field">
          <label>频率惩罚</label>
          <input type="range" id="frequency_penalty" min="-2" max="2" step="0.1" value="0">
          <span class="val" id="frequency_penaltyVal">0.0</span>
        </div>
        <div class="field">
          <label>存在惩罚</label>
          <input type="range" id="presence_penalty" min="-2" max="2" step="0.1" value="0">
          <span class="val" id="presence_penaltyVal">0.0</span>
        </div>
      </div>
    </div>

    <div class="input-row">
      <button class="icon-btn" id="toggleParams" title="参数">⚙</button>
      <textarea id="input" rows="1" placeholder="输入消息，回车发送，Shift+回车换行"></textarea>
      <button class="send" id="send">发送</button>
    </div>
  </footer>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const paramsEl = document.getElementById('params');
  const toggleParamsBtn = document.getElementById('toggleParams');

  const fields = ['temperature', 'top_p', 'frequency_penalty', 'presence_penalty'];
  fields.forEach(id => {
    const el = document.getElementById(id);
    const valEl = document.getElementById(id + 'Val');
    el.addEventListener('input', () => {
      valEl.textContent = parseFloat(el.value).toFixed(id === 'temperature' || id === 'top_p' ? 1 : 1);
    });
  });

  toggleParamsBtn.addEventListener('click', () => paramsEl.classList.toggle('open'));

  function addMessage(role, text, pending) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (pending ? ' pending' : '');
    bubble.textContent = text;
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  }

  function buildBody(text) {
    const body = { message: text };
    body.temperature = parseFloat(document.getElementById('temperature').value);
    body.top_p = parseFloat(document.getElementById('top_p').value);
    const mt = document.getElementById('max_tokens').value;
    if (mt) body.max_tokens = parseInt(mt, 10);
    body.frequency_penalty = parseFloat(document.getElementById('frequency_penalty').value);
    body.presence_penalty = parseFloat(document.getElementById('presence_penalty').value);
    return body;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    inputEl.value = '';
    autoResize();

    addMessage('user', text);
    const pendingBubble = addMessage('assistant', '思考中…', true);

    sendBtn.disabled = true;
    statusEl.textContent = '生成中';

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(buildBody(text)),
      });

      if (!res.ok) {
        let detail = 'HTTP ' + res.status;
        try {
          const errData = await res.json();
          if (errData.detail) detail = errData.detail;
        } catch (e) {}
        throw new Error(detail);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        fullText += decoder.decode(value, { stream: true });
        pendingBubble.classList.remove('pending');
        pendingBubble.textContent = fullText;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      fullText += decoder.decode();
      pendingBubble.classList.remove('pending');
      pendingBubble.textContent = fullText || '(空回复)';
    } catch (err) {
      pendingBubble.classList.remove('pending');
      if (!pendingBubble.textContent) pendingBubble.textContent = '请求失败：' + err.message;
    } finally {
      sendBtn.disabled = false;
      statusEl.textContent = '就绪';
      inputEl.focus();
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('input', autoResize);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
</script>
</body>
</html>
